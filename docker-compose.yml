version: '2.3'

services:
  face-recognition:
    build: .
    container_name: face_recognition_app
    # Note: 'runtime: nvidia' was removed because it is unsupported by some older docker-compose versions.
    # To enable GPU access, set "default-runtime": "nvidia" in /etc/docker/daemon.json on the host.
    privileged: true
    volumes:
      - ./config:/app/config
      - ./models:/app/models
      - ./data:/app/data
      - /dev/video0:/dev/video0 # Primary Camera
    environment:
      - DISPLAY=${DISPLAY}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PYTHONPATH=/app/src
    network_mode: host
    restart: unless-stopped
    stdin_open: true
    tty: true
