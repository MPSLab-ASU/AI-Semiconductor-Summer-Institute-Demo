camera:
  device_id: 0
  fps: 30
  height: 480
  width: 640
display:
  bbox_color:
  - 0
  - 255
  - 0
  font_scale: 0.6
  show_confidence: true
  show_fps: true
  text_color:
  - 255
  - 255
  - 255
  thickness: 2
face_detection:
  confidence_threshold: 0.5
  dnn_model_path: models/face_detection/deploy.prototxt
  dnn_weights_path: models/face_detection/res10_300x300_ssd_iter_140000.caffemodel
  haar_cascade_path: haarcascade_frontalface_default.xml
  method: dnn
  min_neighbors: 5
  min_size:
  - 30
  - 30
  scale_factor: 1.1
face_recognition:
  database_path: data/face_database.pkl
  embedding_size: 128
  model_path: src/models/custom_model.tflite
  similarity_threshold: 0.6
gpu:
  device_id: 0
  enabled: true
  memory_growth: true
performance:
  detection_size:
  - 320
  - 240
  resize_for_detection: true
  skip_frames: 0
